<kendo-buttongroup selection="single" class="kendoButtonWidth">
  <button type="button" kendoButton class="kendoButtonWidth" [selected]="!value" (click)="change(false)"
    [toggleable]="true" [disabled]="disablednobutton">{{nolabel}}</button>
  <button type="button" kendoButton class="kendoButtonWidth" [selected]="value" (click)="change(true)"
    [toggleable]="true" [disabled]="disabledsibutton">{{silabel}}</button>
</kendo-buttongroup>
