<div [formGroup]="qdcservice.AcquaForm" *ngIf="qdcservice.mostraAcqua();">
    <div class="row form-row">

        <div class="col-12 col-md-6">
            <div class="acqua-title text-blue" style="font-size: 15px;">
                <div class="faBoxAcquaInMiscela"></div>
                {{ "qdc.AcquaInMiscelaBotteDiluzione.Text" | transloco }}
                <br *ngIf="qdcservice.EsisteProdottoPolverulento()">
                {{ componi_descrizione_Acqua() }} *
            </div>
        </div>

        <div class="col-12 col-md-3">
            <gias-numeric-template
                [name]="('qdc.rblAcqua_HAResource1.Text' | transloco) + getUdM() + ' '+ getProvenienza()"
                [obligatory]="true"
                [clearButton]="true"
                giasFormControlName="Acqua_Ha"
                [format]="qdcservice.Obj_Default_Numeric_Settings.format"
                [minValue]="qdcservice.Obj_Default_Numeric_Settings.min"
                [step]="qdcservice.Obj_Default_Numeric_Settings.step"
                [decimals]="qdcservice.Obj_Default_Numeric_Settings.decimals"
                (valueChange)="changeAcqua_Ha($event)">
            </gias-numeric-template>

            <!--<div class="row"
                 *ngIf="qdcservice.obj_Acqua_Provenienza && qdcservice.obj_Acqua_Provenienza.Descrizione !== ''">
                <label
                    id="lbl_acqua_provenienza">{{ qdcservice.obj_Acqua_Provenienza.Descrizione }}</label>
            </div>-->
        </div>

        <div class="col-12 col-md-3">
            <gias-numeric-template
                [name]="'qdc.rblAcqua_TotResource1.Text' | transloco"
                [obligatory]="true"
                [clearButton]="true"
                giasFormControlName="Acqua_Tot"
                [format]="qdcservice.Obj_Default_Numeric_Settings.format"
                [minValue]="qdcservice.Obj_Default_Numeric_Settings.min"
                [step]="qdcservice.Obj_Default_Numeric_Settings.step"
                [decimals]="qdcservice.Obj_Default_Numeric_Settings.decimals"
                (valueChange)="changeAcqua_Tot($event)">
            </gias-numeric-template>
        </div>
    </div>
</div>
